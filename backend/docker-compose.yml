services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: reachinbox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reachinbox"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/reachinbox?schema=public"
      DIRECT_URL: "postgresql://postgres:postgrespassword@postgres:5432/reachinbox?schema=public"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/reachinbox?schema=public"
      DIRECT_URL: "postgresql://postgres:postgrespassword@postgres:5432/reachinbox?schema=public"
      REDIS_URL: "redis://redis:6379"
      PORT: 3000
      JWT_SECRET: "replace-this-in-production"
      FRONTEND_URL: "http://localhost:5173"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["npm", "start"]

  worker:
    build: .
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/reachinbox?schema=public"
      DIRECT_URL: "postgresql://postgres:postgrespassword@postgres:5432/reachinbox?schema=public"
      REDIS_URL: "redis://redis:6379"
      WORKER_CONCURRENCY: 5
      WORKER_LOCK_DURATION: 30000
      PROCESSING_STALE_MS: 60000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["npm", "run", "worker:prod"]

volumes:
  pgdata:
  redisdata:
